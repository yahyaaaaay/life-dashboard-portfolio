<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahya's Dashboard — Live Demo</title>
<meta name="description" content="A self-contained, framework-free personal dashboard (tasks, calendar, job tracker, gym logger, university, notes) — single HTML file, no build step. Live interactive demo.">
<style id="appstyle">
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f0f0ed; --border:#e2e2de;
  --text:#1b1b19; --text-dim:#6b6b65; --text-faint:#95948d;
  --accent:#2f5fe0; --accent-ink:#ffffff;
  --success:#1a8a4a; --success-bg:#e6f6ec;
  --warning:#b3720a; --warning-bg:#fdf1de;
  --danger:#c22a2a; --danger-bg:#fbe9e9;
  --neutral-bg:#eceef2; --neutral-ink:#3a4256;
  --radius:14px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,20,15,0.04), 0 1px 8px rgba(20,20,15,0.03);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a; --surface:#202225; --surface-2:#26282b; --border:#34363a;
    --text:#eceeee; --text-dim:#a8aaae; --text-faint:#75777b;
    --accent:#6d93ff; --accent-ink:#0d1730;
    --success:#4fce8b; --success-bg:#123322;
    --warning:#e3a94a; --warning-bg:#3a2a0e;
    --danger:#f0797a; --danger-bg:#3a1616;
    --neutral-bg:#2b2e33; --neutral-ink:#c7cad0;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 1px 10px rgba(0,0,0,0.25);
  }
  :root:not([data-theme="light"]) .badge.applied{background:#1b2a4a; color:#9db8ff;}
}
:root[data-theme="dark"] .badge.applied{background:#1b2a4a; color:#9db8ff;}
:root[data-theme="dark"]{
  --bg:#17181a; --surface:#202225; --surface-2:#26282b; --border:#34363a;
  --text:#eceeee; --text-dim:#a8aaae; --text-faint:#75777b;
  --accent:#6d93ff; --accent-ink:#0d1730;
  --success:#4fce8b; --success-bg:#123322;
  --warning:#e3a94a; --warning-bg:#3a2a0e;
  --danger:#f0797a; --danger-bg:#3a1616;
  --neutral-bg:#2b2e33; --neutral-ink:#c7cad0;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 1px 10px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#root{max-width:1180px; margin:0 auto; padding:20px 16px 60px;}
a{color:var(--accent);}
h1,h2,h3{font-weight:650; margin:0;}
.header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px;}
.header .greet h1{font-size:22px; letter-spacing:-0.01em;}
.header .greet .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
.savebar{font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:6px;}
.demobar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; background:var(--neutral-bg); color:var(--neutral-ink); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 14px; font-size:13px; margin-bottom:14px;}
.demoreset{flex:none; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer;}
.demoreset:hover{border-color:var(--accent); color:var(--accent);}
.dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex:none;}
.dot.ok{background:var(--success);}
.dot.busy{background:var(--warning);}
.dot.err{background:var(--danger);}
.stats{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; min-width:118px; box-shadow:var(--shadow);}
.stat .n{font-size:20px; font-weight:700;}
.stat .l{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:16px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 16px 18px; box-shadow:var(--shadow); min-width:0;}
.card.wide{grid-column:1 / -1;}
.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; -webkit-overflow-scrolling:touch; scrollbar-width:thin;}
.navtab{display:flex; align-items:center; gap:6px; flex:none; font:inherit; font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; white-space:nowrap;}
.navtab .ic{font-size:15px;}
.navtab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.navtab:hover:not(.active){background:var(--surface-2);}
.page .card{width:100%;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px; box-shadow:var(--shadow); cursor:pointer; text-align:left; font:inherit; color:var(--text); display:flex; flex-direction:column; gap:6px;}
.tile:hover{border-color:var(--accent);}
.tile h3{font-size:13.5px; display:flex; align-items:center; gap:7px; margin:0;}
.tile .preview{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.tile .more{font-size:11.5px; color:var(--accent); margin-top:2px;}
.stat{cursor:pointer;}
.stat:hover{border-color:var(--accent);}
.subtabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
.subtab{flex:none; font:inherit; font-size:12.5px; padding:6px 12px; border-radius:8px; border:1px solid transparent; background:var(--surface-2); color:var(--text-dim); cursor:pointer; white-space:nowrap;}
.subtab.active{background:var(--accent); color:var(--accent-ink);}
.subtab:hover:not(.active){border-color:var(--border);}
.gym-row{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 11px; margin-bottom:8px;}
.gym-row label{font-size:10.5px; color:var(--text-faint); display:flex; flex-direction:column; gap:3px;}
.gym-row input{width:100%;}
.gymhero{text-align:center; padding:20px 16px;}
.gymhero .eyebrow{text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--accent); font-weight:700;}
.gymhero h2{font-size:24px; margin:8px 0 6px;}
.gymhero p{max-width:440px; margin:0 auto 14px; color:var(--text-dim); font-size:13px;}
.setgrid{display:grid; grid-template-columns:28px 1fr 1fr; gap:10px; align-items:end; margin-bottom:8px;}
.setgrid .idx{font-weight:700; color:var(--accent); padding-bottom:8px;}
.setgrid label{font-size:10.5px; color:var(--text-faint); display:flex; flex-direction:column; gap:3px;}
.resttimer{display:inline-flex; align-items:center; gap:8px; font-size:12px; background:var(--surface-2); padding:4px 10px; border-radius:999px;}
.pr-pill{color:var(--accent); font-weight:700; font-size:12.5px; margin-top:6px;}
.iframe-wrap{width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow); background:var(--surface-2);}
.iframe-wrap iframe{width:100%; height:800px; border:0; display:block;}
.card h2{font-size:14.5px; display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.card h2 .ic{font-size:16px;}
.muted{color:var(--text-dim); font-size:12.5px;}
.faint{color:var(--text-faint); font-size:11.5px;}
ul.plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
.row{display:flex; align-items:flex-start; gap:9px;}
.row .grow{flex:1; min-width:0;}
.taskline{display:flex; align-items:flex-start; gap:9px; padding:7px 8px; border-radius:var(--radius-sm); background:var(--surface-2);}
.taskline.done .txt{text-decoration:line-through; color:var(--text-faint);}
.taskline input[type=checkbox]{margin-top:2px; width:15px; height:15px; accent-color:var(--accent); flex:none;}
.txt{font-size:13.5px; word-break:break-word;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--neutral-bg); color:var(--neutral-ink); white-space:nowrap;}
.due{font-size:11px; color:var(--text-faint); white-space:nowrap;}
.iconbtn{border:none; background:transparent; color:var(--text-faint); cursor:pointer; font-size:14px; line-height:1; padding:4px; border-radius:6px; flex:none;}
.iconbtn:hover{color:var(--danger); background:var(--danger-bg);}
form.addrow{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
input[type=text], input[type=date], input[type=url], textarea, select{
  font:inherit; font-size:13px; padding:7px 9px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); outline:none;
}
input[type=text]:focus, input[type=date]:focus, input[type=url]:focus, textarea:focus, select:focus{border-color:var(--accent);}
form.addrow input[type=text]{flex:1; min-width:110px;}
select.catsel{max-width:100px;}
button.btn{font:inherit; font-size:13px; padding:7px 13px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer; white-space:nowrap;}
button.btn:hover{filter:brightness(1.06);}
button.btn.ghost{background:transparent; color:var(--accent);}
table{width:100%; border-collapse:collapse; font-size:12.8px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); font-weight:600; padding:0 8px 6px; border-bottom:1px solid var(--border);}
td{padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.tablewrap{overflow-x:auto;}
.badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; font-weight:600;}
.badge.lead{background:var(--neutral-bg); color:var(--neutral-ink);}
.badge.applied{background:#e6effe; color:#2f5fe0;}
.badge.interview{background:var(--warning-bg); color:var(--warning);}
.badge.offer{background:var(--success-bg); color:var(--success);}
.badge.rejected{background:var(--danger-bg); color:var(--danger);}
.jobstatus{font-size:11.5px; padding:3px 5px; border-radius:6px;}
.emailrow{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--border);}
.emailrow:last-child{border-bottom:none;}
.emailrow .who{font-weight:600; font-size:12.5px; min-width:120px;}
.emailrow .what{font-size:12.5px; color:var(--text-dim); flex:1; min-width:0;}
.emailrow .when{font-size:11px; color:var(--text-faint); white-space:nowrap;}
.notesbox{width:100%; min-height:120px; resize:vertical; font-size:13px; line-height:1.5;}
.filecats{display:flex; flex-direction:column; gap:10px;}
.filecat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); margin-bottom:5px; font-weight:600;}
.filechip{display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--surface-2); padding:4px 9px; border-radius:99px; margin:0 5px 5px 0;}
.gymday{border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; margin-bottom:8px;}
.gymday .d{font-weight:650; font-size:13px; margin-bottom:4px;}
.gymday .ex{font-size:12.5px; color:var(--text-dim); padding:1px 0;}
.empty{color:var(--text-faint); font-size:12.5px; font-style:italic; padding:6px 2px;}
.footer-note{margin-top:22px; text-align:center; color:var(--text-faint); font-size:11.5px;}
@media (max-width:640px){
  .header{flex-direction:column; align-items:flex-start;}
  .emailrow{flex-wrap:wrap;}
  .emailrow .who{min-width:0;}
}
</style>
</head>

(function(){
"use strict";
var SCRIPT_TEXT = document.currentScript.textContent;
var STYLE_TEXT = document.getElementById('appstyle').textContent;
var PAGE_TITLE = "Yahya's Dashboard";
var root = document.getElementById('root');
var stateEl = document.getElementById('state-data');

// This is a public portfolio demo: outside Claude, window.claude doesn't exist,
// so edits fall back to this browser's localStorage instead of Claude's artifact
// capability. Nothing here ever leaves your own browser.
var STANDALONE = !(window.claude && window.claude.use);
var STORAGE_KEY = 'life-dashboard-demo-state-v1';

var state;
try { state = JSON.parse(stateEl.textContent); } catch(e){ state = {tasks:[],calendar:[],jobs:[],gym:{note:"",plan:[],log:[]},university:{},notes:"",files:[],emails:{items:[]}}; }
if(STANDALONE){
  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved) state = JSON.parse(saved);
  }catch(e){}
}
state.tasks = state.tasks || [];
state.calendar = state.calendar || [];
state.jobs = state.jobs || [];
state.gym = state.gym || {templates:[],workouts:[],cardio:[]};
state.gym.templates = state.gym.templates || [];
state.gym.workouts = state.gym.workouts || [];
state.gym.cardio = state.gym.cardio || [];
state.university = state.university || {};
state.notes = state.notes || "";
state.files = state.files || [];
state.emails = state.emails || {items:[]};

var artifactApi = null;

var activeTab = "overview"; // per-viewer only, never persisted

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtDate(d){
  if(!d) return "";
  var dt = new Date(d+"T00:00:00");
  if(isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function daysUntil(d){
  if(!d) return null;
  var dt = new Date(d+"T00:00:00");
  if(isNaN(dt.getTime())) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((dt-today)/86400000);
}

function getExercise(id){ return EXERCISES.find(function(e){ return e.id===id; }); }
function formatRest(seconds){
  seconds = Number(seconds)||0;
  if(seconds<60) return seconds+'s';
  var m = Math.floor(seconds/60), s = seconds%60;
  return s ? (m+'m '+s+'s') : (m+'m');
}
function formatCountdown(seconds){
  seconds = Math.max(0, Math.ceil(seconds));
  var m = Math.floor(seconds/60), s = seconds%60;
  return m + ':' + (s<10?'0':'') + s;
}

/* ---------- gym: workout/template helpers ---------- */
function volume(exercises){
  return (exercises||[]).reduce(function(total, ex){
    return total + (ex.sets||[]).reduce(function(sum, s){ return sum + (Number(s.reps)||0) * (Number(s.weight)||0); }, 0);
  }, 0);
}
function bestSet(workouts, exerciseId){
  var best = null;
  (workouts||[]).forEach(function(w){
    (w.exercises||[]).forEach(function(ex){
      if(ex.exerciseId !== exerciseId) return;
      (ex.sets||[]).forEach(function(set){
        if(!best || Number(set.weight) > Number(best.weight)) best = set;
      });
    });
  });
  return best;
}
function lastPerformance(workouts, exerciseId){
  for(var i=0;i<(workouts||[]).length;i++){
    var w = workouts[i];
    var found = (w.exercises||[]).find(function(e){ return e.exerciseId===exerciseId; });
    if(found && found.sets && found.sets.length) return {date: w.date, sets: found.sets};
  }
  return null;
}
function formatWorkoutDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined,{day:'2-digit', month:'short', year:'numeric'});
}

function withFocusPreserved(fn){
  var active = document.activeElement;
  var id = active && active.id;
  var start = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  var end = (active && typeof active.selectionEnd==='number') ? active.selectionEnd : null;
  fn();
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(start!=null && el.setSelectionRange){ try{ el.setSelectionRange(start,end); }catch(e){} }
    }
  }
}

function playGymGreeting(){
  if(gymGreetedPlayed) return;
  try{
    if(sessionStorage.getItem('gymGreeted')){ gymGreetedPlayed = true; return; }
  }catch(e){}
  gymGreetedPlayed = true;
  if(!('speechSynthesis' in window)) return;
  var speak = function(){
    try{
      var u = new SpeechSynthesisUtterance('Hello, Sir Yahya.');
      u.rate = 0.82; u.pitch = 0.35; u.volume = 1;
      var voices = window.speechSynthesis.getVoices();
      var deep = voices.find(function(v){ return /male|david|mark|daniel|george|fred/i.test(v.name); });
      if(deep) u.voice = deep;
      window.speechSynthesis.speak(u);
      try{ sessionStorage.setItem('gymGreeted','1'); }catch(e){}
    }catch(e){}
  };
  try{
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    speak();
  }catch(e){
    var onTap = function(){ speak(); window.removeEventListener('pointerdown', onTap); };
    window.addEventListener('pointerdown', onTap, {once:true});
  }
}

function render(){
  var openTasks = state.tasks.filter(function(t){return !t.done;}).length;
  var upcoming = state.calendar.filter(function(c){ var d = daysUntil(c.date); return d!==null && d>=0 && d<=21; }).length;
  var activeJobs = state.jobs.filter(function(j){ return j.status==='applied' || j.status==='interview'; }).length;
  var unread = (state.emails && state.emails.unreadCount) || 0;

  var navHtml = TABS.map(function(t){
    return '<button class="navtab' + (activeTab===t.id?' active':'') + '" data-action="goTab" data-tab="' + t.id + '"><span class="ic">' + t.icon + '</span><span class="lbl">' + esc(t.label) + '</span></button>';
  }).join('');

  var body;
  if(activeTab==='tasks') body = renderTasks();
  else if(activeTab==='calendar') body = renderCalendar();
  else if(activeTab==='jobs') body = renderJobs();
  else if(activeTab==='university') body = renderUniversity();
  else if(activeTab==='gym') body = renderGym();
  else if(activeTab==='emails') body = renderEmails();
  else if(activeTab==='files') body = renderFiles();
  else if(activeTab==='notes') body = renderNotes();
  else body = renderOverview();

  var html = ''
    + (STANDALONE ? (
      '<div class="demobar">'
      + '<span><strong>Demo mode</strong> — sample data, no account needed. Everything you click actually works and saves in this browser only.</span>'
      + '<button type="button" class="demoreset" data-action="resetDemo">Reset demo data</button>'
      + '</div>'
    ) : '')
    + '<div class="header">'
    +   '<div class="greet"><h1>Hey Yahya 👋</h1><div class="sub">' + esc(new Date().toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'})) + '</div></div>'
    +   '<div class="savebar"><span class="dot ' + saveDotClass() + '" id="save-dot"></span><span id="save-label">' + saveLabel() + '</span></div>'
    + '</div>'
    + '<div class="stats">'
    +   stat(openTasks, 'open tasks', 'tasks')
    +   stat(upcoming, 'events in 3 weeks', 'calendar')
    +   stat(activeJobs, 'applications active', 'jobs')
    +   stat(unread, 'unread emails', 'emails')
    + '</div>'
    + '<nav class="tabbar">' + navHtml + '</nav>'
    + '<div class="page">' + body + '</div>'
    + '<div class="footer-note">Everything here (tasks, calendar, applications, gym, notes) is editable and saves for you automatically — ask me anytime to refresh the email snapshot or research more job leads.</div>';

function stat(n, label, tab){
  return '<div class="stat" data-action="goTab" data-tab="' + tab + '"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
}

function renderOverview(){
  var openTasks = state.tasks.filter(function(t){return !t.done;});
  var nextEvents = state.calendar.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}).filter(function(c){var d=daysUntil(c.date); return d===null||d>=0;}).slice(0,3);
  var topJobs = state.jobs.slice(0,3);
  var g = state.gym || {};
  var e = state.emails || {items:[]};
  var filesCount = (state.files||[]).length;

  function tile(tab, icon, title, previewHtml){
    return '<button class="tile" data-action="goTab" data-tab="' + tab + '"><h3><span class="ic">' + icon + '</span>' + esc(title) + '</h3><div class="preview">' + previewHtml + '</div><div class="more">View ' + esc(title) + ' →</div></button>';
  }

  var tasksPreview = openTasks.length ? openTasks.slice(0,3).map(function(t){return esc(t.text);}).join('<br>') : 'All caught up.';
  var calPreview = nextEvents.length ? nextEvents.map(function(c){return esc(c.title) + ' — ' + esc(fmtDate(c.date));}).join('<br>') : 'Nothing scheduled.';
  var jobsPreview = topJobs.length ? topJobs.map(function(j){return esc(j.company) + ' — ' + esc(j.role||'');}).join('<br>') : 'No leads yet.';
  var uniPreview = esc((state.university && state.university.program) || '') + '<br>' + esc((state.university && state.university.school) || '');
  var gymPreview = (g.templates && g.templates.length) ? (g.templates.length + ' template(s), ' + (g.workouts?g.workouts.length:0) + ' workout(s) logged') : 'No templates yet — build one.';
  var emailPreview = (e.items && e.items.length) ? ((e.unreadCount||0) + ' unread — latest: ' + esc(e.items[0].subject)) : 'No recent mail.';
  var filesPreview = filesCount ? (filesCount + ' documents on file') : 'No files yet.';
  var notesPreview = state.notes ? (esc(state.notes.slice(0,80)) + (state.notes.length>80?'…':'')) : 'Nothing jotted down.';

  return '<div class="grid">'
    + tile('tasks','✅','Tasks', tasksPreview)
    + tile('calendar','📅','Calendar', calPreview)
    + tile('jobs','💼','Jobs', jobsPreview)
    + tile('university','🎓','University', uniPreview)
    + tile('gym','🏋️','Gym', gymPreview)
    + tile('emails','📧','Emails', emailPreview)
    + tile('files','📁','Files', filesPreview)
    + tile('notes','📝','Notes', notesPreview)
    + '</div>';
}

function renderTasks(){

      + '</li>';
  }).join('');

    + '<h2><span class="ic">✅</span>Tasks</h2>'

function renderGymWorkout(){
  if(!activeWorkout){
    return '<div class="card wide"><div class="empty">No workout in progress.</div><button class="btn" style="margin-top:10px;" data-action="gymGoto" data-view="templates">Back to templates</button></div>';
  }
  var w = activeWorkout;
  var totalVol = volume(w.exercises);
  var sections = w.exercises.map(function(ex, exIndex){
    var exercise = getExercise(ex.exerciseId);
    var previous = lastPerformance(state.gym.workouts, ex.exerciseId);
    var restSec = ex.restSeconds || (exercise?exercise.defaultRest:60);
    var timer = restTimers[exIndex];
    var timerHtml;
    if(timer && timer.running){
      timerHtml = '<span class="resttimer">⏱ <span id="rest-remaining-' + exIndex + '">' + formatCountdown(timer.remaining) + '</span> <button class="iconbtn" data-action="gymStopRest" data-idx="' + exIndex + '" title="Stop">✕</button></span>';
    } else {
      timerHtml = '<button class="btn ghost" data-action="gymStartRest" data-idx="' + exIndex + '" data-seconds="' + restSec + '">⏱ Start rest (' + formatRest(restSec) + ')</button>';
    }
    var setsHtml = ex.sets.map(function(set, setIndex){
      return '<div class="setgrid">'
        + '<div class="idx">' + (setIndex+1) + '</div>'
        + '<label>Reps<input type="number" min="0" value="' + set.reps + '" data-action="gymSetField" data-ex="' + exIndex + '" data-set="' + setIndex + '" data-field="reps"></label>'
        + '<label>Weight (kg)<input type="number" min="0" step="2.5" value="' + set.weight + '" data-action="gymSetField" data-ex="' + exIndex + '" data-set="' + setIndex + '" data-field="weight"></label>'
        + '</div>';
    }).join('');
    return '<div class="card wide">'
      + '<div class="row" style="justify-content:space-between; flex-wrap:wrap;">'
      +   '<h3 style="margin:0; font-size:16px;">' + esc(exercise?exercise.name:ex.exerciseId) + '</h3>'
      +   timerHtml
      + '</div>'
      + (previous ? '<div class="faint" style="margin:6px 0 10px;">Last time (' + esc(formatWorkoutDate(previous.date)) + '): ' + previous.sets.map(function(s){ return s.weight+'kg×'+s.reps; }).join(', ') + '</div>' : '')
      + setsHtml
      + '<button class="btn ghost" data-action="gymAddSet" data-ex="' + exIndex + '">+ Add set</button>'
      + '</div>';
  }).join('');
  return '<button class="btn ghost" style="margin-bottom:12px;" data-action="gymGoto" data-view="templates">← Back to templates</button>'
    + '<div class="card wide">'
    +   '<div class="faint" style="text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--accent);">Workout in progress</div>'
    +   '<h2 style="margin:4px 0;">' + esc(w.templateName) + '</h2>'
    +   '<div class="muted">Volume so far: ' + totalVol.toLocaleString() + ' kg</div>'
    + '</div>'
    + sections
    + '<button class="btn" style="width:100%;" data-action="gymFinishWorkout">✔ Finish &amp; save workout</button>';
}

function renderGymProgress(){
  var g = state.gym;
  var trackedIds = [];
  g.workouts.forEach(function(w){ (w.exercises||[]).forEach(function(ex){ if(trackedIds.indexOf(ex.exerciseId)<0) trackedIds.push(ex.exerciseId); }); });
  var prCards = trackedIds.map(function(id){
    var pr = bestSet(g.workouts, id);
    if(!pr) return '';
    var ex = getExercise(id);
    return '<div class="card"><div class="row" style="justify-content:space-between;"><span>' + esc(ex?ex.name:id) + '</span><span class="pr-pill">' + pr.weight + ' kg × ' + pr.reps + '</span></div></div>';
  }).join('');
  var history = g.workouts.map(function(w){
    var exLines = (w.exercises||[]).map(function(ex){
      var exercise = getExercise(ex.exerciseId);
      return '<div class="row" style="justify-content:space-between;"><span>' + esc(exercise?exercise.name:ex.exerciseId) + '</span><span class="faint">' + ex.sets.map(function(s){return s.weight+'kg×'+s.reps;}).join(', ') + '</span></div>';
    }).join('');
    return '<div class="card wide">'
      + '<div class="row" style="justify-content:space-between;">'
      +   '<div><h3 style="margin:0; font-size:15px;">' + esc(w.templateName) + '</h3><span class="faint">' + esc(formatWorkoutDate(w.date)) + '</span></div>'
      +   '<div class="row"><span class="tag" style="background:var(--success-bg); color:var(--success);">' + volume(w.exercises).toLocaleString() + ' kg</span><button class="iconbtn" data-action="gymDeleteWorkout" data-id="' + w.id + '" title="Delete">✕</button></div>'
      + '</div>'
      + exLines
      + '</div>';
  }).join('');
  var cardioHist = g.cardio.map(function(c){
    return '<li class="taskline"><span class="grow"><span class="txt">' + esc(c.name) + '</span><br><span class="faint">' + esc(formatWorkoutDate(c.date)) + '</span></span><span class="tag">' + c.minutes + ' min</span></li>';
  }).join('');

  return '<div class="card wide"><h2><span class="ic">📈</span>Progress</h2><div class="muted">Everything you train is saved here — beat these numbers next session.</div></div>'
    + (prCards ? '<div class="card wide" style="margin-top:12px;"><h3 style="margin-bottom:8px;">Personal records</h3><div class="grid">' + prCards + '</div></div>' : '')
    + '<div style="margin-top:12px;">' + (history || '<div class="card wide"><div class="empty">No workouts saved yet. Start a template to log your first session.</div></div>') + '</div>'
    + (cardioHist ? '<div class="card wide" style="margin-top:12px;"><h3 style="margin-bottom:8px;">Cardio history</h3><ul class="plain">' + cardioHist + '</ul></div>' : '');
}

function startWorkout(templateId){
  var t = state.gym.templates.find(function(x){ return x.id===templateId; });
  if(!t) return;
  activeWorkout = {
    templateId: t.id,
    templateName: t.name,
    exercises: t.exercises.map(function(row){
      var prev = lastPerformance(state.gym.workouts, row.exerciseId);
      var sets = [];
      for(var i=0;i<row.sets;i++){
        sets.push({
          reps: (prev && prev.sets[i]) ? prev.sets[i].reps : row.reps,
          weight: (prev && prev.sets[i]) ? prev.sets[i].weight : 0
        });
      }
      return {exerciseId: row.exerciseId, sets: sets, restSeconds: row.restSeconds};
    })
  };
  Object.keys(restTimers).forEach(function(k){ if(restTimers[k].intervalId) clearInterval(restTimers[k].intervalId); });
  restTimers = {};
  gymView = 'workout';
  render();
}

function fmtWhen(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined,{month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

function saveDotClass(){
  return apiState==='ok' ? 'ok' : (apiState==='busy' ? 'busy' : (apiState==='error' ? 'err' : ''));
}
function saveLabel(){
  if(STANDALONE) return apiState==='ok' ? 'Saved in this browser (demo mode)' : 'Demo mode — changes save to this browser only';
  if(apiState==='ok') return 'Saved to your dashboard';
  if(apiState==='busy') return 'Saving…';
  if(apiState==='error') return 'Save failed — will retry next edit';
  if(apiState==='unavailable') return 'Changes stay in this view only (open in claude.ai to sync)';
  return 'Connecting…';
}
function updateSaveUI(){
  var dot = document.getElementById('save-dot'); var label = document.getElementById('save-label');
  if(dot){ dot.className = 'dot ' + saveDotClass(); }
  if(label){ label.textContent = saveLabel(); }
}

function buildFullDocument(s){
  var json = JSON.stringify(s).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + PAGE_TITLE + '</title>\n<style id="appstyle">' + STYLE_TEXT + '</style>\n</head>\n<body>\n<script type="application/json" id="state-data">' + json + '<' + '/script>\n<div id="root"></div>\n<script id="appscript">' + SCRIPT_TEXT + '<' + '/script>\n</body>\n</html>';
}

var saveTimer = null;
function save(immediate){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  var run = function(){
    doSave();
  };
  if(immediate){ run(); } else { saveTimer = setTimeout(run, 900); }
}

function doSave(){
  if(STANDALONE){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      apiState = 'ok';
    }catch(e){
      apiState = 'error';
    }
    updateSaveUI();
    return;
  }
  if(!artifactApi){
    apiState = 'unavailable'; updateSaveUI(); return;
  }
  apiState = 'busy'; updateSaveUI();
  artifactApi.publish(buildFullDocument(state)).then(function(){
    apiState = 'ok'; updateSaveUI();
  }).catch(function(e){
    if(e && e.code === 'conflict'){ /* view reloads automatically */ return; }
    apiState = 'error'; updateSaveUI();
  });
}

function resetDemoData(){
  if(!STANDALONE) return;
  var ok = window.confirm('Reset the demo back to its original sample data? This clears everything you\'ve added in this browser.');
  if(!ok) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}

/* ---------- event handling ---------- */

root.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');
  if(action === 'resetDemo'){
    resetDemoData();
  } else if(action === 'goTab'){
    activeTab = el.getAttribute('data-tab');
    render();
  } else if(action === 'toggleTask'){
    var t = state.tasks.find(function(x){return x.id===id;});
    if(t){ t.done = el.checked; render(); save(true); }
  } else if(action === 'delTask'){
    state.tasks = state.tasks.filter(function(x){return x.id!==id;});
    render(); save(true);
  } else if(action === 'delEvent'){
    state.calendar = state.calendar.filter(function(x){return x.id!==id;});
    render(); save(true);
  } else if(action === 'delJob'){
    state.jobs = state.jobs.filter(function(x){return x.id!==id;});
    render(); save(true);
  } else if(action === 'gymGoto'){
    gymView = el.getAttribute('data-view');
    render();
  } else if(action === 'gymFilterGroup'){
    gymGroupFilter = el.getAttribute('data-group');
    render();
  } else if(action === 'startWorkout'){
    startWorkout(id);
  } else if(action === 'gymOpenBuilder'){
    gymBuilderOpen = true; gymBuilder = {name:'', rows:[]};
    render();
  } else if(action === 'gymCancelBuilder'){
    gymBuilderOpen = false; gymBuilder = {name:'', rows:[]};
    render();
  } else if(action === 'gymSaveTemplate'){
    var tname = (gymBuilder.name||'').trim();
    if(!tname || gymBuilder.rows.length===0) return;
    state.gym.templates.unshift({id: uid(), name: tname, createdAt: new Date().toISOString(), exercises: gymBuilder.rows.slice()});
    gymBuilderOpen = false; gymBuilder = {name:'', rows:[]};
    render(); save(true);
  } else if(action === 'gymDeleteTemplate'){
    state.gym.templates = state.gym.templates.filter(function(t){return t.id!==id;});
    render(); save(true);
  } else if(action === 'gymDuplicateTemplate'){
    var orig = state.gym.templates.find(function(t){return t.id===id;});
    if(orig){
      state.gym.templates.unshift({id: uid(), name: orig.name + ' (copy)', createdAt: new Date().toISOString(), exercises: JSON.parse(JSON.stringify(orig.exercises))});
      render(); save(true);
    }
  } else if(action === 'gymRenameStart'){
    gymEditingTemplateId = id;
    render();
  } else if(action === 'gymRowRemove'){
    var ridx = Number(el.getAttribute('data-idx'));
    gymBuilder.rows.splice(ridx, 1);
    render();
  } else if(action === 'gymRowMove'){
    var midx = Number(el.getAttribute('data-idx')), dir = Number(el.getAttribute('data-dir'));
    var target = midx + dir;
    if(target>=0 && target<gymBuilder.rows.length){
      var tmp = gymBuilder.rows[midx];
      gymBuilder.rows[midx] = gymBuilder.rows[target];
      gymBuilder.rows[target] = tmp;
      render();
    }
  } else if(action === 'gymAddSet'){
    var aexIdx = Number(el.getAttribute('data-ex'));
    var exObj = activeWorkout.exercises[aexIdx];
    var lastSet = exObj.sets[exObj.sets.length-1] || {reps:10, weight:0};
    exObj.sets.push({reps: lastSet.reps, weight: lastSet.weight});
    render();
  } else if(action === 'gymFinishWorkout'){
    if(activeWorkout){
      state.gym.workouts.unshift({
        id: uid(), templateId: activeWorkout.templateId, templateName: activeWorkout.templateName,
        date: new Date().toISOString(), exercises: activeWorkout.exercises
      });
      Object.keys(restTimers).forEach(function(k){ if(restTimers[k].intervalId) clearInterval(restTimers[k].intervalId); });
      restTimers = {};
      activeWorkout = null;
      gymView = 'progress';
      render(); save(true);
    }
  } else if(action === 'gymStartRest'){
    var sidx = Number(el.getAttribute('data-idx')), secs = Number(el.getAttribute('data-seconds'));
    if(restTimers[sidx] && restTimers[sidx].intervalId) clearInterval(restTimers[sidx].intervalId);
    var timerObj = {remaining: secs, running: true, intervalId: null};
    restTimers[sidx] = timerObj;
    timerObj.intervalId = setInterval(function(){
      timerObj.remaining -= 1;
      var elx = document.getElementById('rest-remaining-' + sidx);
      if(elx) elx.textContent = formatCountdown(timerObj.remaining);
      if(timerObj.remaining <= 0){
        timerObj.running = false;
        clearInterval(timerObj.intervalId);
        render();
      }
    }, 1000);
    render();
  } else if(action === 'gymStopRest'){
    var stidx = Number(el.getAttribute('data-idx'));
    if(restTimers[stidx] && restTimers[stidx].intervalId) clearInterval(restTimers[stidx].intervalId);
    delete restTimers[stidx];
    render();
  } else if(action === 'gymDeleteCardio'){
    state.gym.cardio = state.gym.cardio.filter(function(c){return c.id!==id;});
    render(); save(true);
  } else if(action === 'gymDeleteWorkout'){
    state.gym.workouts = state.gym.workouts.filter(function(w){return w.id!==id;});
    render(); save(true);
  }
});

root.addEventListener('change', function(e){
  var el = e.target;
  var action = el.getAttribute && el.getAttribute('data-action');
  if(action === 'toggleTask'){ return; } // handled in click for checkboxes in some browsers; safe no-op
  if(action === 'jobStatus'){
    var id = el.getAttribute('data-id');
    var j = state.jobs.find(function(x){return x.id===id;});
    if(j){ j.status = el.value; save(true); }
  } else if(action === 'gymAddRow'){
    if(!el.value) return;
    var exc = getExercise(el.value);
    if(!exc) return;
    gymBuilder.rows.push({exerciseId: el.value, sets:3, reps:10, restSeconds: exc.defaultRest});
    render();
  } else if(action === 'gymRowField'){
    var fidx = Number(el.getAttribute('data-idx')), field = el.getAttribute('data-field');
    var fval = Number(el.value) || 0;
    gymBuilder.rows[fidx][field] = fval;
    render();
  } else if(action === 'gymSetField'){
    var gexIdx = Number(el.getAttribute('data-ex')), gsetIdx = Number(el.getAttribute('data-set')), gfield = el.getAttribute('data-field');
    var gval = Number(el.value) || 0;
    activeWorkout.exercises[gexIdx].sets[gsetIdx][gfield] = gval;
    render();
  } else if(action === 'gymRenameInput'){
    var rid = el.getAttribute('data-id');
    var rname = el.value.trim();
    var tpl = state.gym.templates.find(function(t){return t.id===rid;});
    if(tpl && rname){ tpl.name = rname; save(true); }
    gymEditingTemplateId = null;
    render();
  }
});

root.addEventListener('input', function(e){
  var el = e.target;
  var action = el.getAttribute && el.getAttribute('data-action');
  if(el.id === 'notes-area'){
    state.notes = el.value;
    save(false);
  } else if(action === 'gymSearch'){
    gymSearch = el.value;
    withFocusPreserved(render);
  } else if(action === 'gymBuilderName'){
    gymBuilder.name = el.value;
  }
});

root.addEventListener('keydown', function(e){
  var action = e.target.getAttribute && e.target.getAttribute('data-action');
  if(e.key === 'Enter' && (action === 'gymRenameInput' || action === 'gymBuilderName')){
    e.preventDefault();
    e.target.blur();
  }
});

root.addEventListener('submit', function(e){
  var form = e.target.closest('[data-action]');
  if(!form) return;
  e.preventDefault();
  var action = form.getAttribute('data-action');
  var fd = new FormData(form);
  if(action === 'addTask'){
    var text = (fd.get('text')||'').toString().trim();
    if(!text) return;
    state.tasks.push({id: uid(), text: text, category: fd.get('category')||'general', done:false, due: fd.get('due')||''});
    render(); save(true);
  } else if(action === 'addEvent'){
    var title = (fd.get('title')||'').toString().trim();
    var date = fd.get('date');
    if(!title || !date) return;
    state.calendar.push({id: uid(), date: date, title: title, notes:''});
    render(); save(true);
  } else if(action === 'addJob'){
    var company = (fd.get('company')||'').toString().trim();
    if(!company) return;
    state.jobs.push({id: uid(), company: company, role: (fd.get('role')||'').toString(), location:(fd.get('location')||'').toString()||'Munich', status:'lead', link:(fd.get('link')||'').toString(), notes:''});
    render(); save(true);
  } else if(action === 'addCardio'){
    var cname = (fd.get('name')||'').toString().trim();
    var cmins = Number(fd.get('minutes'));
    if(!cname || !cmins || cmins<=0) return;
    state.gym.cardio.unshift({id: uid(), name: cname, minutes: cmins, date: new Date().toISOString()});
    render(); save(true);
  }
});

/* ---------- capability init ---------- */

function initCapability(){
  if(STANDALONE){ apiState = 'ok'; updateSaveUI(); return; }
  if(!window.claude || !window.claude.use){ apiState = 'unavailable'; updateSaveUI(); return; }
  window.claude.use('artifact').then(function(api){
    artifactApi = api;
    apiState = api ? 'ok' : 'unavailable';
    updateSaveUI();
  }).catch(function(){ apiState = 'unavailable'; updateSaveUI(); });
}

render();
initCapability();
})();
</script>
